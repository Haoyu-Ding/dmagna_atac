name: container

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Container version without the leading v'
        required: true
        default: '0.1.0'

env:
  IMAGE_NAME: ghcr.io/haoyu-ding/dmagna_atac

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image version
        id: image_version
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            printf 'tag=%s\n' "${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            printf 'tag=%s\n' "$DISPATCH_TAG" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.image_version.outputs.tag }}
            ${{ env.IMAGE_NAME }}:latest
